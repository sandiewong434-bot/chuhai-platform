# Alembic 配置文件
# 详情见 https://alembic.sqlalchemy.org/en/latest/config.html

[alembic]
# 迁移脚本输出目录
script_location = alembic

# 模板文件
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 是否追加时间戳到迁移文件名
prepend_sys_path = .

# 迁移版本路径
version_path_separator = os

# SQLAlchemy 数据库 URL（由 env.py 从环境变量读取覆盖）
sqlalchemy.url = postgresql://chuhai:chuhai@localhost:5432/chuhai

[post_write_hooks]
# 代码格式化钩子（可选）
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
