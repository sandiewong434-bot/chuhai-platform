version: "3.8"

services:
  # PostgreSQL 数据库（生产环境使用，测试环境注释掉）
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: chuhai
  #     POSTGRES_PASSWORD: chuhai
  #     POSTGRES_DB: chuhai
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

  # Redis 缓存（可选）
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chuhai-backend
    ports:
      - "8000:8000"
    environment:
      # 测试环境使用 SQLite（挂载宿主机已有数据库）
      - DATABASE_URL=sqlite:///./data/chuhai.db
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://127.0.0.1"]
      - REDIS_ENABLED=false
      - SECRET_KEY=chuhai-test-secret-key-change-in-production
    volumes:
      # 挂载现有数据库（包含全部 174 篇文章、86 实体、19 关系等）
      - ./backend/chuhai_dev.db:/app/data/chuhai.db
      # 开发模式：挂载代码支持热更新
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chuhai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
