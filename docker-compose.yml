# ============================================================
# 出海综合服务平台 · Docker Compose
# PostgreSQL + Redis + FastAPI Backend + Nginx
# ============================================================

version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: chuhai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chuhai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chuhai}
      POSTGRES_DB: ${POSTGRES_DB:-chuhai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chuhai} -d ${POSTGRES_DB:-chuhai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chuhai-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: chuhai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chuhai-net

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chuhai-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chuhai}:${POSTGRES_PASSWORD:-chuhai}@postgres:5432/${POSTGRES_DB:-chuhai}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chuhai-net
    command: >
      sh -c "
        echo '⏳ 等待数据库就绪...' &&
        sleep 3 &&
        alembic upgrade head || true &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Nginx 反向代理（可选，生产环境启用）
  nginx:
    image: nginx:alpine
    container_name: chuhai-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - chuhai-net
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  chuhai-net:
    driver: bridge
