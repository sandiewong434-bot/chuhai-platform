name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署只依赖代码本身成功推到 main。原文件误写了 needs:[backend,frontend]
# 但本文件里没有这两个 job（它们定义在 ci.yml），会导致部署 0 秒直接失败。
# 已移除无效依赖：部署前请确保 ci.yml 通过（如需强制门禁可改回，但需在 on 里加
# 对 ci 的依赖，或用 branch protection / required checks）。
jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- 前置检查：secrets 是否配齐 ----
      - name: 检查部署 secrets 是否已配置
        id: secrets-check
        run: |
          MISSING=""
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING="$MISSING SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING="$MISSING SSH_USER"
          [ -z "${{ secrets.SSH_KEY }}" ] && MISSING="$MISSING SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error:: 缺少部署凭据:$MISSING。请先在仓库 Settings → Secrets and variables → Actions 配置后再运行。"
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "secrets ok"

      # ---- 远端服务器准备就绪检查（SSH 连通 + 目录存在）----
      - name: 检查远端服务器 SSH 连接与目录
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "SSH 连接成功: $(hostname)"
            if [ ! -d /opt/chuhai-platform/.git ]; then
              echo "::error:: /opt/chuhai-platform 尚不是 git 仓库，需先在服务器执行: git clone <repo> /opt/chuhai-platform"
              exit 1
            fi
            docker --version
            (docker compose version >/dev/null 2>&1 && echo "compose: docker compose (v2)") || (docker-compose version >/dev/null 2>&1 && echo "compose: docker-compose (v1)") || echo "::error:: 未检测到 docker compose"

      # ---- 拉取代码并重新构建部署 ----
      - name: 部署并重建容器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/chuhai-platform
            # 兼容 docker compose (v2) 与 docker-compose (v1)
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            git fetch origin main
            git pull origin main
            export DOCKER_BUILDKIT=1
            $DC down --remove-orphans || true
            $DC up -d --build
            echo "---- 容器状态 ----"
            $DC ps

      # ---- 健康检查等待 ----
      - name: 等待服务健康
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "等待后端健康检查..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "后端健康检查通过 ✓ (${i} 次尝试)"
                exit 0
              fi
              sleep 5
            done
            echo "::error:: 后端 /health 在 150 秒内未就绪"
            exit 1
